---
# Builds the Windows installer for a version tag and uploads it to a DRAFT GitHub release, with the latest.yml and
# .blockmap files the in-app updater reads. Nothing reaches users until the draft is published by hand
# (see "Releasing" in README.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the draft release and upload its files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Use 'npm version' to bump and tag together."
            exit 1
          fi

      - run: npm ci
      - run: npm run check # Biome: lint + formatting
      - run: npm run typecheck
      - run: npm test

      - name: Build the installer
        run: npm run dist:win

      # Uploaded with gh, not electron-builder's --publish: electron-builder 26 creates its GitHub publisher per file
      # without awaiting a shared one, so the installer and its .blockmap raced to create two releases for the same tag
      # and v0.1.0 ended up with its .exe and latest.yml on a hidden draft.
      - name: Upload to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          files=("release/Clerisy-Setup-$version.exe" "release/Clerisy-Setup-$version.exe.blockmap" "release/latest.yml")
          ls -l "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to change its files."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Clerisy $version" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      # the job used to succeed without the installer; fail instead if any file the updater needs is missing
      - name: Check the release has every file
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          for f in "Clerisy-Setup-$version.exe" "Clerisy-Setup-$version.exe.blockmap" latest.yml; do
            grep -qxF "$f" <<< "$assets" || { echo "::error::$f is missing from release $GITHUB_REF_NAME"; exit 1; }
          done
          count="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")"
          [ "$count" = "1" ] || { echo "::error::$count releases exist for $GITHUB_REF_NAME; expected 1"; exit 1; }
